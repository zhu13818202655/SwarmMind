# SwarmMind Alembic configuration.
# Used both by the `alembic` CLI and by `swarmmind.repositories.migrations`
# at runtime. The DSN is **not** stored here — it is resolved from the
# active SwarmMindConfig (or the SWARMMIND_POSTGRES__DSN env var) inside
# alembic/env.py so that ops never need to maintain a duplicate.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
# Single-line revision IDs (yyyymmdd_HHMM_slug)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Intentionally left blank: env.py loads it dynamically.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
