# SwarmMind Configuration

sandbox:
  provider: opensandbox
  api_key: ${OPEN_SANDBOX_API_KEY}
  base_url: http://localhost:45698
  default_profile: py-basic
  create_retries: 3
  create_backoff: 1.0

agent:
  model:
    provider: openai
    name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    temperature: 0.7
    max_tokens: 4096

  memory:
    short_term_max_blocks: 10
    long_term_enabled: false
    long_term_storage_type: memory

  max_steps: 100
  timeout: 300

rate_limit:
  enabled: false
  per_minute: 60

log_level: INFO

storage_path: ./data
