# SwarmMind Configuration

sandbox:
  provider: opensandbox
  api_key: ${OPEN_SANDBOX_API_KEY}
  base_url: ${OPEN_SANDBOX_BASE_URL}
  default_profile: aio
  create_retries: 3
  create_backoff: 1.0
  request_timeout_seconds: 600

postgres:
  enabled: false
  dsn: postgresql://swarmmind:swarmmind@127.0.0.1:5432/swarmmind
  auto_init_schema: true

redis:
  enabled: false
  url: redis://127.0.0.1:6379/0
  event_stream: swarmmind:events
  channel_prefix: swarmmind
  cache_prefix: swarmmind:cache
  lock_prefix: swarmmind:lock
  default_lock_ttl: 30

vector_store:
  provider: memory
  enabled: false
  qdrant_url: http://127.0.0.1:6333
  collection: swarmmind
  embedding_dimension: 256

search:
  provider: tavily
  api_key: ${SWARMMIND_SEARCH__API_KEY}
  base_url: null
  timeout_seconds: 10.0
  default_max_results: 5
  google_cse_id: ${GOOGLE_CSE_ID}
  market: en-US
  safe_search: moderate

browser:
  detail_provider: direct
  reader_base_url: https://r.jina.ai/http://
  timeout_seconds: 30.0
  user_agent: SwarmMindBrowser/1.0

agent:
  model:
    provider: litellm
    name: ${OPENAI_MODEL}
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_BASE_URL}
    temperature: 1.0
    max_tokens: 4096

  memory:
    short_term_max_blocks: 10
    long_term_enabled: false
    long_term_storage_type: memory

  max_steps: 100
  timeout: 300

api:
  title: SwarmMind API
  description: A general-purpose AI task assistant API
  version: 0.1.0
  host: 127.0.0.1
  port: 8000
  reload: false

identity:
  default_tenant_id: local
  default_principal_id: developer
  default_scopes:
    - tasks:submit
    - tasks:read
    - runs:read
  default_roles:
    - developer
  auth_method: static

rate_limit:
  enabled: false
  per_minute: 60

log_level: INFO

storage_path: ./data
