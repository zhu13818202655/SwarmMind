# AIO Profile - unified all-in-one sandbox for coding, execution, conversion, and browser tasks

name: aio
image: ghcr.io/agent-infra/sandbox:latest
entrypoint: /opt/gem/run.sh
timeout_seconds: 3600

env:
  PYTHONPATH: /tmp
  PIP_NO_CACHE_DIR: "1"
  PYTHON_VERSION: "3.11"

resource_limits:
  cpu: 2
  memory: 2048