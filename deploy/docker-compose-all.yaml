services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swarmmind
      POSTGRES_USER: swarmmind
      POSTGRES_PASSWORD: swarmmind
    ports:
      - "2360:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmmind -d swarmmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swarmmind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "2361:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: swarmmind:wuyi-report-v0.1
    container_name: swarmmind-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      SWARMMIND_POSTGRES__ENABLED: "true"
      SWARMMIND_POSTGRES__DSN: postgresql://swarmmind:swarmmind@postgres:5432/swarmmind
      SWARMMIND_PROJECT_ROOT: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: swarmmind:wuyi-report-v0.2
    container_name: swarmmind-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SWARMMIND_API__HOST: 0.0.0.0
      SWARMMIND_API__PORT: 8000
      SWARMMIND_UVICORN_WORKERS: "${SWARMMIND_UVICORN_WORKERS:-4}"
      SWARMMIND_POSTGRES__ENABLED: "true"
      SWARMMIND_POSTGRES__DSN: postgresql://swarmmind:swarmmind@postgres:5432/swarmmind
      SWARMMIND_POSTGRES__AUTO_INIT_SCHEMA: "false"
      SWARMMIND_REDIS__ENABLED: "true"
      SWARMMIND_REDIS__URL: redis://redis:6379/0
      SWARMMIND_STORAGE_PATH: /app/data
      # The Text-to-SQL knowledge base is shipped at /app/knowledge/fly_report_text2sql
      # (outside backend_data so the volume mount does not shadow it).
      SWARMMIND_FLY_REPORT__TEXT2SQL__KNOWLEDGE_PATH: /app/knowledge/fly_report_text2sql
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    extra_hosts:
      # Let the container resolve host.docker.internal to the host gateway
      # on Linux too (already works on Docker Desktop). Used by
      # SWARMMIND_BROWSER__READER_BASE_URL / SWARMMIND_SANDBOX__BASE_URL
      # when those services run on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.29.1-alpine
    container_name: swarmmind-nginx
    restart: unless-stopped
    ports:
      - "50022:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_data: