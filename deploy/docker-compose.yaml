services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swarmmind
      POSTGRES_USER: swarmmind
      POSTGRES_PASSWORD: swarmmind
    ports:
      - "2360:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmmind -d swarmmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swarmmind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "2361:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: swarmmind-qdrant
    restart: unless-stopped
    ports:
      - "2363:6333"
      - "2364:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  qdrant_data: