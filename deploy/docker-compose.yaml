services:
  postgres:
    image: postgres:16-alpine
    container_name: swarmmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swarmmind
      POSTGRES_USER: swarmmind
      POSTGRES_PASSWORD: swarmmind
    ports:
      - "2360:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmmind -d swarmmind"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swarmmind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "2361:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: swarmmind-qdrant
    profiles:
      - qdrant
    restart: unless-stopped
    ports:
      - "2363:6333"
      - "2364:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: swarmmind:wuyi-report-v0.1
    container_name: swarmmind-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      SWARMMIND_POSTGRES__ENABLED: "true"
      SWARMMIND_POSTGRES__DSN: postgresql://swarmmind:swarmmind@postgres:5432/swarmmind
      SWARMMIND_PROJECT_ROOT: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: swarmmind:wuyi-report-v0.1
    container_name: swarmmind-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SWARMMIND_API__HOST: 0.0.0.0
      SWARMMIND_API__PORT: 8000
      SWARMMIND_UVICORN_WORKERS: "${SWARMMIND_UVICORN_WORKERS:-4}"
      SWARMMIND_POSTGRES__ENABLED: "true"
      SWARMMIND_POSTGRES__DSN: postgresql://swarmmind:swarmmind@postgres:5432/swarmmind
      SWARMMIND_POSTGRES__AUTO_INIT_SCHEMA: "false"
      SWARMMIND_REDIS__ENABLED: "true"
      SWARMMIND_REDIS__URL: redis://redis:6379/0
      SWARMMIND_VECTOR_STORE__ENABLED: "${SWARMMIND_VECTOR_STORE__ENABLED:-false}"
      SWARMMIND_VECTOR_STORE__PROVIDER: qdrant
      SWARMMIND_VECTOR_STORE__QDRANT_URL: http://qdrant:6333
      SWARMMIND_STORAGE_PATH: /app/data
    expose:
      - "8000"
    volumes:
      - backend_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.29.1-alpine
    container_name: swarmmind-nginx
    restart: unless-stopped
    ports:
      - "50022:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  backend_data: