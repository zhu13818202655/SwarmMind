[project]
name = "swarmmind"
version = "0.1.0"
description = "A general-purpose AI task assistant with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opensandbox>=0.1.5,<0.2.0",
    "agentscope>=1.0.16,<2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pyyaml>=6.0.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
skills = [
    "python-pptx>=0.6.0",
]
memory = [
    "chromadb>=0.4.0",
]
all = [
    "python-pptx>=0.6.0",
    "chromadb>=0.4.0",
]

[project.scripts]
swarmmind = "swarmmind.cli:main"
swarmmind-api = "swarmmind.api.server:run_server"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmmind*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
