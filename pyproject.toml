[project]
name = "swarmmind"
version = "0.1.0"
description = "A general-purpose AI task assistant with multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opensandbox>=0.1.5,<0.2.0",
    "agentscope>=1.0.16,<2.0.0",
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "psycopg[binary]>=3.2.0",
    # Vanna 2.0 PostgresRunner imports psycopg2 (the legacy v2 driver) directly,
    # so we ship psycopg2-binary alongside psycopg v3.
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "aiolimiter>=1.1.0",
    "click>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "agent-sandbox==0.0.18",
    "loguru>=0.7.3",
    "python-docx>=1.1.0",
    "matplotlib>=3.8.0",
    "chromadb>=0.5.0",
    "vanna>=2.0.2,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "opensandbox-server>=0.1.9,<0.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]
skills = [
    "python-pptx>=0.6.0",
]
memory = [
    "chromadb>=0.4.0",
]
all = [
    "python-pptx>=0.6.0",
    "chromadb>=0.4.0",
]

[project.scripts]
swarmmind = "swarmmind.cli:main"
swarmmind-api = "swarmmind.api.server:run_server"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["swarmmind*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
